<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
  <h1>TETRIS</h1>
  <div class="layout">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="side">
      <div class="panel">
        <h2>NEXT</h2>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="panel">
        <h2>HOLD</h2>
        <canvas id="hold" width="120" height="120"></canvas>
      </div>
      <div class="panel">
        <h2>SCORE</h2>
        <div id="score">0</div>
      </div>
      <div class="panel">
        <h2>LINES</h2>
        <div id="lines">0</div>
      </div>
      <div class="panel">
        <h2>LEVEL</h2>
        <div id="level">1</div>
      </div>
      <div class="panel controls">
        <h2>OPERATION</h2>
        <p>← → : move</p>
        <p>↑ : rotate</p>
        <p>↓ : soft drop</p>
        <p>space : hard drop</p>
        <p>C : hold</p>
        <p>P : pause</p>
      </div>
      <button id="restart">RESTART</button>
    </div>
  </div>
  <div id="overlay" class="overlay hidden">
    <div id="overlay-text">GAME OVER</div>
    <button id="overlay-restart">もう一度遊ぶ</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
